name: build

on:
  push:
    branches:
      - fabric-26.2-build
      - full-release-1.0
      - genetics-1.3
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.5.1'

      - name: Build Beyond Realms
        run: gradle build --stacktrace

      - name: Validate JSON resources
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          errors = []
          for path in Path('src/main/resources').rglob('*.json'):
              try:
                  json.loads(path.read_text(encoding='utf-8'))
              except Exception as exc:
                  errors.append(f'{path}: {exc}')
          if errors:
              raise SystemExit('\n'.join(errors))
          print('All JSON resources parsed successfully.')
          PY

      - name: Smoke-test dedicated server startup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          : > server-smoke.log
          gradle runServer --no-daemon > server-smoke.log 2>&1 &
          pid=$!
          for i in $(seq 1 120); do
            if grep -q 'Done (' server-smoke.log; then
              echo 'Minecraft dedicated server reached a successful startup state.'
              kill "$pid" || true
              wait "$pid" || true
              exit 0
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat server-smoke.log
              echo 'Server exited before reaching startup.' >&2
              exit 1
            fi
            sleep 1
          done
          cat server-smoke.log
          kill "$pid" || true
          wait "$pid" || true
          echo 'Server did not reach startup within 120 seconds.' >&2
          exit 1

      - name: Upload server smoke-test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: BeyondRealms-server-smoke-log
          path: server-smoke.log
          if-no-files-found: ignore

      - name: Upload mod jars
        uses: actions/upload-artifact@v7
        with:
          name: BeyondRealms-26.2
          path: build/libs/*.jar
